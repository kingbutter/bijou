services:
  bijou:
    # Use the published image, or swap for `build: .` to build from source.
    image: ghcr.io/OWNER/bijou:latest
    # build: .
    container_name: bijou
    restart: unless-stopped

    ports:
      - "8080:8080"

    # Copy .env.example to .env and edit it. Keep .env out of git.
    env_file:
      - .env

    # Nothing is written to disk — the poster cache lives in memory.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
