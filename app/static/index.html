<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bijou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Saira+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* To run with no internet, delete the three <link> tags above, put the woff2
   files in fonts/, and uncomment this block. See fonts/README.txt.
@font-face{font-family:'Big Shoulders Display';src:url('/fonts/big-shoulders.woff2') format('woff2');
           font-weight:500 800;font-display:swap}
@font-face{font-family:'Saira Condensed';src:url('/fonts/saira-condensed.woff2') format('woff2');
           font-weight:400 600;font-display:swap}
*/
:root{
  --void:        #05060a;
  --chrome-hi:   #c8cdd6;
  --chrome-lo:   #3d434b;
  --chrome-deep: #1a1d22;
  --tungsten:    #ffc46b;
  --filament:    #fff3d4;
  --ember:       #6b4a22;
  --enamel-red:  #8e1b22;
  --paper:       #e9e3d6;

  --chase-dur: 5.2s;   /* full lap of the bulb chase */
  --chase-step: -0.16s;/* per-bulb offset; sets how many run at once */
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  background:var(--void);
  overflow:hidden;
  cursor:none;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
}

/* Faint pool of light on the wall behind the case */
body::before{
  content:"";position:fixed;inset:0;
  background:radial-gradient(60% 45% at 50% 46%, rgba(255,196,107,.10), transparent 70%);
  pointer-events:none;
}

#stage{height:100%;display:block}
@keyframes drift{from{transform:translate(-3px,-3px)}to{transform:translate(3px,3px)}}

/* ── Rotation ─────────────────────────────────────────────────────────
   Set with ?rotate=90|180|270 on the URL. Doing it here rather than in the
   compositor keeps the display off the driver's rotated-scanout path, which
   is where Intel graphics tend to hand you a black screen. */
html[data-rot="90"] #stage,
html[data-rot="270"] #stage{
  position:absolute;top:0;left:0;
  width:100vh;height:100vw;
  transform-origin:top left;
}
html[data-rot="90"]  #stage{transform:translateX(100vw) rotate(90deg)}
html[data-rot="270"] #stage{transform:translateY(100vh) rotate(-90deg)}
html[data-rot="180"] #stage{transform:rotate(180deg)}

/* ── The case ─────────────────────────────────────────────────────── */
.case{
  --w: 100vw;
  /* Deliberately 8px larger than the screen with a matching negative margin,
     so the slow drift below never exposes a black edge. */
  width:calc(100% + 8px);
  height:calc(100% + 8px);
  margin:-4px;
  /* Slow drift so a fixed image never sits on the same pixels for years */
  animation:drift 1200s ease-in-out infinite alternate;
  font-size:calc(var(--w)/30);
  position:relative;
  display:flex;
  padding:1.9em;
  background:
    linear-gradient(160deg,#20242b 0%,#0d0f13 28%,#171a20 52%,#0b0d11 74%,#22262d 100%);
  box-shadow:
    inset 0 0 0 .09em rgba(200,205,214,.34),
    inset 0 .12em .3em rgba(255,255,255,.10),
    inset 0 -.12em .3em rgba(0,0,0,.7),
    0 1.4em 3.5em rgba(0,0,0,.85);
}

html[data-rot="90"] .case,
html[data-rot="270"] .case{--w: 100vh}

/* Chrome bezel that holds the glass */
.inner{
  position:relative;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  border-radius:.18em;
  padding:.42em;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo) 42%,var(--chrome-deep));
  box-shadow:0 .1em .5em rgba(0,0,0,.8), inset 0 0 .2em rgba(255,255,255,.25);
  overflow:hidden;
}

/* Corner screws — the case is bolted to the wall */
.screw{
  position:absolute;width:.5em;height:.5em;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#9aa1ab,#41464e 60%,#15171b);
  box-shadow:0 .04em .08em rgba(0,0,0,.9), inset 0 0 .05em rgba(255,255,255,.5);
}
.screw::after{
  content:"";position:absolute;inset:.16em .06em;
  background:rgba(10,11,14,.85);border-radius:.02em;transform:rotate(28deg);
}
.screw.tl{top:.62em;left:.62em}.screw.tr{top:.62em;right:.62em}
.screw.bl{bottom:.62em;left:.62em}.screw.br{bottom:.62em;right:.62em}

/* ── Header plaque ────────────────────────────────────────────────── */
.plaque{
  position:relative;flex:1 0 2.9em;display:grid;place-items:center;
  border-radius:.1em .1em 0 0;
  background:linear-gradient(180deg,#15171c,#0a0b0e 55%,#101216);
  box-shadow:inset 0 -.08em .25em rgba(0,0,0,.9), inset 0 .06em 0 rgba(255,255,255,.09);
  transition:background .6s ease;
  overflow:hidden;
}
.case[data-mode="now"] .plaque{
  background:linear-gradient(180deg,#a8262e,var(--enamel-red) 55%,#5d1015);
}
.plaque .label{
  font-family:'Big Shoulders Display','Haettenschweiler','Arial Narrow','DejaVu Sans Condensed',Impact,sans-serif;
  font-weight:800;font-size:1.62em;letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;color:var(--tungsten);
  text-shadow:0 0 .04em rgba(255,243,212,.9), 0 0 .5em rgba(255,196,107,.55), 0 .03em 0 rgba(0,0,0,.8);
  transition:color .6s ease,text-shadow .6s ease;
  white-space:nowrap;
}
.case[data-mode="now"] .plaque .label{
  color:#fff6ea;
  text-shadow:0 0 .04em #fff, 0 0 .55em rgba(255,214,214,.7), 0 .03em .02em rgba(0,0,0,.55);
}
/* thin tungsten strip lighting the plaque from below */
.plaque::after{
  content:"";position:absolute;left:6%;right:6%;bottom:0;height:.09em;
  background:linear-gradient(90deg,transparent,var(--tungsten),transparent);
  opacity:.55;
}

/* ── Glass + poster ───────────────────────────────────────────────── */
.glass{
  /* 2:3 so a standard one-sheet fills it exactly. It may shrink below that
     on a squarish panel, in which case background-size:contain keeps the
     poster in proportion. */
  position:relative;flex:0 1 auto;aspect-ratio:2/3;min-height:0;overflow:hidden;
  background:#050608;   /* backing board behind the sheet */
}
.poster{
  position:absolute;inset:0;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  opacity:0;transition:opacity .85s ease;
}
/* ?poster=fill crops the sheet to the glass instead of fitting it inside */
html[data-poster="fill"] .poster{background-size:cover}
/* Demo posters are inlined rather than set as a background image, so their
   lettering can use the same webfonts as the rest of the case. */
.poster svg{position:absolute;inset:0;width:100%;height:100%;display:block}
html[data-poster="fill"] .poster svg{object-fit:cover}
.poster.live{opacity:1}

/* Real reflection: a fixed diagonal sheet of light on the pane */
.glass::before{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(107deg,
    rgba(255,255,255,.13) 0%, rgba(255,255,255,.05) 17%,
    transparent 30%, transparent 72%,
    rgba(255,255,255,.035) 86%, rgba(255,255,255,.09) 100%);
}
/* Inside of the box is darker at the edges than the middle */
.glass::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 2.2em rgba(0,0,0,.65);
  background:radial-gradient(120% 80% at 50% 8%, rgba(255,196,107,.11), transparent 55%);
}

/* Progress — only present while something is actually playing */
.progress{
  position:absolute;left:0;right:0;bottom:0;height:.22em;z-index:4;
  background:rgba(0,0,0,.55);opacity:0;transition:opacity .5s ease;
}
.case[data-mode="now"] .progress{opacity:1}
.progress i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#ffb347,var(--filament));
  box-shadow:0 0 .5em rgba(255,196,107,.9);
  transition:width 1s linear;
}

/* ── Billing strip ────────────────────────────────────────────────── */
.billing{
  position:relative;flex:1 0 5em;padding:.5em 1em;
  display:grid;align-content:center;justify-items:center;gap:.28em;text-align:center;
  background:linear-gradient(180deg,#14161b,#090a0d);
  box-shadow:inset 0 .07em 0 rgba(255,255,255,.08);
}
.title{
  font-family:'Big Shoulders Display','Haettenschweiler','Arial Narrow','DejaVu Sans Condensed',Impact,sans-serif;
  font-weight:700;font-size:1.32em;line-height:1;letter-spacing:.05em;
  color:var(--paper);text-transform:uppercase;max-width:100%;
  text-shadow:0 .03em .06em rgba(0,0,0,.9);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{
  font-family:'Saira Condensed','DejaVu Sans Condensed','Arial Narrow',sans-serif;
  font-weight:400;font-size:.72em;letter-spacing:.24em;text-indent:.24em;
  color:rgba(233,227,214,.52);text-transform:uppercase;white-space:nowrap;
}
.meta span+span::before{content:"·";margin:0 .7em;color:rgba(255,196,107,.55)}

/* ── Bulbs ────────────────────────────────────────────────────────── */
#bulbs{
  position:absolute;inset:0;pointer-events:none;opacity:.92;
  transition:opacity .4s ease, filter .4s ease;
}
.bulb{
  position:absolute;width:.72em;height:.72em;margin:-.36em 0 0 -.36em;border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #3a2c17, var(--ember) 55%, #241708);
  box-shadow:inset 0 0 .1em rgba(0,0,0,.9), 0 .03em .06em rgba(0,0,0,.6);
}
.bulb b{ /* the lit filament + its spill onto the frame */
  position:absolute;inset:0;border-radius:50%;display:block;
  background:radial-gradient(circle at 42% 36%, var(--filament) 0%, var(--tungsten) 42%, #b56a14 100%);
  box-shadow:0 0 .35em .06em rgba(255,196,107,.95), 0 0 1.1em .2em rgba(255,168,60,.45);
  opacity:0;
  animation:lamp var(--chase-dur) linear infinite;
  animation-delay:calc(var(--i) * var(--chase-step));
}
@keyframes lamp{
  0%   {opacity:.14}
  8%   {opacity:1}
  26%  {opacity:.30}
  100% {opacity:.14}
}
/* Faster, tighter run while a film is playing */
.case[data-mode="now"]{--chase-dur:2.6s;--chase-step:-0.075s}

/* Re-dressing the case: lamps dip, poster swaps, lamps surge back */
.case.dim   #bulbs{opacity:.18}
.case.surge #bulbs{opacity:1;filter:brightness(1.3) saturate(1.08)}

@media (prefers-reduced-motion:reduce){
  .bulb b{animation:none;opacity:.75}
  .case{animation:none}
}

/* Shown only if Plex can't be reached */
#fault{
  position:absolute;left:0;right:0;bottom:.9em;z-index:5;text-align:center;
  font-family:'Saira Condensed',sans-serif;font-size:.62em;letter-spacing:.2em;
  color:rgba(255,120,100,.75);text-transform:uppercase;opacity:0;transition:opacity .4s;
}
#fault.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div class="case" id="case" data-mode="soon">
    <div id="bulbs"></div>
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>

    <div class="inner">
      <div class="plaque"><div class="label" id="label">Coming Soon</div></div>

      <div class="glass">
        <div class="poster" id="pa"></div>
        <div class="poster" id="pb"></div>
        <div class="progress"><i id="bar"></i></div>
        <div id="fault"></div>
      </div>

      <div class="billing">
        <div class="title" id="title"></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>
</div>

  // ?poster=fill crops to the glass; the default fits the whole sheet in
  const fitMode = new URLSearchParams(location.search).get('poster');
  if (fitMode === 'fill') document.documentElement.dataset.poster = 'fill';

  function demoQueue() {
    const items = DEMO_POSTERS.map((p, i) => ({
      key: 'demo' + i, title: p.t, meta: p.m, svg: p.s, thumb: '',
    }));
    return { items, rotate_seconds: 7, poll_seconds: 9999, queue_seconds: 9999 };
  }

  function preload(src) {
    return new Promise(res => {
      const i = new Image();
      i.onload = i.onerror = () => res(src);
      i.src = src;
    });
  }

  // Swap the poster: lamps dip, image crossfades, lamps surge back up.
  async function dress(item, nextMode) {
    if (!item) return;
    const key = item.key + '|' + nextMode;
    if (key === currentKey) return;
    currentKey = key;

    if (!item.svg) await preload(artUrl(item.thumb));

    caseEl.classList.add('dim');
    await wait(320);

    const incoming = layer ? $('pa') : $('pb');
    const outgoing = layer ? $('pb') : $('pa');
    if (item.svg) {
      // Inlined rather than a background image, so the poster's lettering
      // picks up the same webfonts as the rest of the case.
      incoming.style.backgroundImage = '';
      incoming.innerHTML = item.svg;
    } else {
      incoming.innerHTML = '';
      incoming.style.backgroundImage = `url("${artUrl(item.thumb)}")`;
    }
    incoming.classList.add('live');
    outgoing.classList.remove('live');
    layer ^= 1;

    caseEl.dataset.mode = nextMode;
    $('label').textContent = nextMode === 'now' ? 'Now Showing' : 'Coming Soon';
    $('title').textContent = item.title || '';
    $('meta').innerHTML = (item.meta || []).map(m => `<span>${m}</span>`).join('');

    caseEl.classList.remove('dim');
    caseEl.classList.add('surge');
    await wait(480);
    caseEl.classList.remove('surge');
  }

  // ── Coming soon rotation ────────────────────────────────────────
  async function loadQueue() {
    try {
      const d = demo ? demoQueue() : await api('queue');
      if (d.items && d.items.length) {
        queue = shuffle(d.items);
        qi = 0;
      }
      rotateMs = (d.rotate_seconds || 30) * 1000;
      pollMs = (d.poll_seconds || 5) * 1000;
      queueMs = (d.queue_seconds || 1800) * 1000;
    } catch (e) { /* keep whatever we already have */ }
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextUp() {
    if (!queue.length) return null;
    if (qi >= queue.length) {
      const last = queue[queue.length - 1];
      shuffle(queue);
      // Don't reshuffle straight into the poster that's already up
      if (queue.length > 1 && queue[0] === last) [queue[0], queue[1]] = [queue[1], queue[0]];
      qi = 0;
    }
    return queue[qi++];
  }

  function startRotation() {
    if (rotateTimer) return;
    const tick = () => {
      if (!queue.length) { loadQueue().then(() => dress(nextUp(), 'soon')); return; }
      dress(nextUp(), 'soon');
    };
    tick();
    rotateTimer = setInterval(tick, rotateMs);
  }

  function stopRotation() {
    clearInterval(rotateTimer);
    rotateTimer = null;
  }

  // ── Session polling ─────────────────────────────────────────────
  let demoFlip = 0;
  async function poll() {
    if (demo) {
      // Every fourth poster, pretend something started playing
      const item = nextUp();
      const nowShowing = (++demoFlip % 4) === 0;
      await dress(item, nowShowing ? 'now' : 'soon');
      if (nowShowing) runProgress(38 * 60000, 112 * 60000); else stopProgress();
      return;
    }
    try {
      const s = await api('state');
      if (s.configured === false) return unconfigured();
      note(s.ok === false ? 'No answer from Plex — retrying' : '');

      if (s.playing) {
        stopRotation();
        await dress(s.playing, 'now');
        runProgress(s.playing.offset_ms, s.playing.duration_ms);
      } else {
        stopProgress();
        startRotation();
      }
    } catch (e) {
      note('No answer from Plex — retrying');
    }
  }

  function note(text) {
    $('fault').textContent = text;
    $('fault').classList.toggle('on', !!text);
  }

  // Fresh install, no token yet. Say so on the wall rather than showing an
  // empty case that looks broken.
  function unconfigured() {
    stopRotation();
    stopProgress();
    caseEl.dataset.mode = 'soon';
    $('label').textContent = 'Coming Soon';
    $('title').textContent = 'Not connected to Plex';
    $('meta').innerHTML = '<span>Open /setup to finish</span>';
    note('');
  }

  // Bar advances locally between polls so it never looks frozen
  function runProgress(offset, duration) {
    stopProgress();
    if (!duration) return;
    let ms = offset;
    const draw = () => { $('bar').style.width = Math.min(100, ms / duration * 100) + '%'; };
    draw();
    prog = setInterval(() => { ms += 1000; draw(); }, 1000);
  }
  function stopProgress() { clearInterval(prog); prog = null; }

  // ── Bulbs ───────────────────────────────────────────────────────
  function layBulbs() {
    const box = $('bulbs');
    // offsetWidth/Height are untransformed layout pixels; getBoundingClientRect
    // would report the rotated screen-space box and put every bulb in the wrong
    // place once ?rotate is in play.
    const cw = caseEl.offsetWidth, ch = caseEl.offsetHeight;
    if (!cw) return;

    const em = parseFloat(getComputedStyle(caseEl).fontSize);
    const inset = em * 0.95;              // bulb centre line, inside the frame edge
    const gap = em * 1.90;                // target spacing between bulbs
    const w = cw - inset * 2;
    const h = ch - inset * 2;
    const nx = Math.max(2, Math.round(w / gap));
    const ny = Math.max(2, Math.round(h / gap));
    const pts = [];

    for (let i = 0; i < nx; i++) pts.push([inset + w * i / nx, inset]);              // top →
    for (let i = 0; i < ny; i++) pts.push([inset + w, inset + h * i / ny]);          // right ↓
    for (let i = 0; i < nx; i++) pts.push([inset + w - w * i / nx, inset + h]);      // bottom ←
    for (let i = 0; i < ny; i++) pts.push([inset, inset + h - h * i / ny]);          // left ↑

    // Index runs backwards so the wave travels clockwise, the way a
    // real marquee chase does.
    const n = pts.length;
    box.innerHTML = pts.map(([x, y], i) =>
      `<i class="bulb" style="left:${x}px;top:${y}px;--i:${n - i}"><b></b></i>`).join('');
  }

  let relayout;
  addEventListener('resize', () => {
    clearTimeout(relayout);
    relayout = setTimeout(layBulbs, 200);
  });

  // ── Boot ────────────────────────────────────────────────────────
  (async function start() {
    layBulbs();
    // Fonts change the em box, which moves the bulbs — re-lay once they land.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layBulbs);
    await loadQueue();
    await poll();
    setInterval(poll, demo ? rotateMs : pollMs);
    if (!demo) setInterval(loadQueue, queueMs);
  })();
})();
