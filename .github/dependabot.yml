version: 2
updates:
  # The app itself has no dependencies. This is only here so the workflow's
  # actions don't quietly rot into another Node deprecation warning.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly